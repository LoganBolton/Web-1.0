# Run Codex over the Weave tasks.
#   OPENAI_API_KEY=... harbor run -c harness/codex-job.yaml
# Change model_name to the model you want to test. Anything on the harbor run command line
# (for example -m, -n, or -p harness/tasks/h014) overrides what is here.
jobs_dir: jobs
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 4
environment:
  type: docker
  delete: true
agents:
  - name: codex
    model_name: openai/gpt-5
    kwargs:
      # Codex's built-in web search runs on OpenAI's servers, outside the task's network
      # rules. The Weave is fictional, so it cannot help honestly, but it could find this
      # repository and its answer file. Keep it off.
      web_search: disabled
datasets:
  - path: harness/tasks
